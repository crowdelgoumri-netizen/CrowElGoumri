appId: host.exp.exponent
---
# Auth flow smoke test: signup, verify phone, land on home screen.
# Precondition: a LOGGED-OUT app (the session persists across runs —
# clear Expo Go's app data or log out first, or the flow fails at
# the "Bonjour" login-screen assertion).
- launchApp

# Dismiss system ANR dialog + Expo Go first-launch dialogs
- evalScript:
    script: |
      if (await isVisible('Wait')) { await tapOn('Wait'); await sleep(1000); }
      if (await isVisible('OK')) { await tapOn("Don't Show Again"); await sleep(1000); }
      if (await isVisible('Continue')) { await tapOn('Continue'); await sleep(500); }

# Open the dev server directly. Expo Go's home screen differs by version
# (recent-servers list vs "Enter URL manually" button), so don't navigate
# its UI — deep-link instead. localhost works because the runner sets up
# `adb reverse tcp:8081 tcp:8081`.
- openLink: "exp://localhost:8081"
- waitForAnimationToEnd:
    timeout: 30000

# Dismiss Android compatibility dialog / dev-menu intro if it appears
- evalScript:
    script: |
      if (await isVisible('OK')) { await tapOn("Don't Show Again"); await sleep(1000); }
      if (await isVisible('Continue')) { await tapOn('Continue'); await sleep(500); }

# Wait for JS bundle to load
- waitForAnimationToEnd:
    timeout: 15000

# The emulated device can starve while Metro compiles the first bundle and
# throw a "System UI isn't responding" ANR over the app — keep dismissing
# until it stops coming back.
- evalScript:
    script: |
      for (let i = 0; i < 5; i++) {
        if (await isVisible('Wait')) { await tapOn('Wait'); await sleep(2000); }
        else break;
      }

# Should be on login screen
- assertVisible: "Bonjour"
- assertVisible: "Se connecter"

# Navigate to signup
- tapOn: "Créer un compte"
- assertVisible: "Rejoignez le réseau Crowshi"

# Fill signup form
- tapOn: "Prénom"
- inputText: "E2E"
- tapOn: "Nom"
- inputText: "Test"
- tapOn: "Adresse e-mail"
- inputText: "e2e-test@crowdshipping.local"
- tapOn: "Téléphone (E.164)"
- inputText: "+213550000001"
- tapOn: "Mot de passe"
- inputText: "Password123"

# Submit
- tapOn: "Créer mon compte"
# Should be on verify-phone screen
- assertVisible: "Vérifiez votre téléphone"

# Enter dev OTP
- tapOn: "Code (6 chiffres)"
- inputText: "000000"
- tapOn: "Vérifier"

# Should land on home (Accueil tab)
- assertVisible: "Europe"
