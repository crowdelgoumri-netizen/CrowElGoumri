appId: host.exp.exponent
---
# Home navigation smoke test: tab switching, verify screens render
# Run this AFTER auth-flow.yaml (which authenticates the user)
- launchApp:
    appId: host.exp.exponent

# Dismiss system ANR dialog + Expo Go first-launch dialogs
- evalScript:
    script: |
      if (await isVisible('Wait')) { await tapOn('Wait'); await sleep(1000); }
      if (await isVisible('OK')) { await tapOn("Don't Show Again"); await sleep(1000); }
      if (await isVisible('Continue')) { await tapOn('Continue'); await sleep(500); }

# Open the dev server by deep link (Expo Go's home screen differs by
# version; 10.0.2.2 is the Android emulator's direct alias for the host,
# so no adb reverse tunnel is needed).
- openLink: "exp://10.0.2.2:8081"
- waitForAnimationToEnd:
    timeout: 30000

# Dismiss Android compatibility dialog / dev-menu intro if it appears
- evalScript:
    script: |
      if (await isVisible('OK')) { await tapOn("Don't Show Again"); await sleep(1000); }
      if (await isVisible('Continue')) { await tapOn('Continue'); await sleep(500); }
- waitForAnimationToEnd

# Wait for home screen (bundle may still be downloading after a Metro
# restart — give it up to 5 min)
- extendedWaitUntil:
    visible: "Europe.*"
    timeout: 900000

# Home tab (default)
- assertVisible: "Europe.*"
- tapOn: "Accueil"

# Messages tab
- tapOn: "Messages"
- assertVisible: "Messages"

# Profile tab
- tapOn: "Profil"
- assertVisible: "Portefeuille"
- assertVisible: "Compte"
- assertVisible: "Vérification d'identité"
- assertVisible: "Paramètres"

# Back to home
- tapOn: "Accueil"
- assertVisible: "Europe.*"
